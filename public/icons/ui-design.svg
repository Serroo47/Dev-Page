  <path d="M132 108H187" stroke="url(#uiGradient)" stroke-width="8" stroke-linecap="round"/>
  <path d="M132 129H176" stroke="url(#uiGradient)" stroke-width="8" stroke-linecap="round" opacity="0.75"/>
  <path d="M132 150H163" stroke="url(#uiGradient)" stroke-width="8" stroke-linecap="round" opacity="0.55"/>

  <!-- cleaner cursor -->
