<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="uiGradient" x1="42" y1="34" x2="214" y2="222" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.52" stop-color="#4F7CFF"/>
      <stop offset="1" stop-color="#6D5DFB"/>
    </linearGradient>

    <filter id="softGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feColorMatrix
        in="blur"
        type="matrix"
        values="0 0 0 0 0.31
                0 0 0 0 0.49
                0 0 0 0 1
                0 0 0 0.28 0"
      />
      <feBlend in="SourceGraphic" mode="normal"/>
    </filter>
  </defs>

  <!-- subtle glow -->
  <path
    d="M45 58C45 45.85 54.85 36 67 36H189C201.15 36 211 45.85 211 58V164C211 176.15 201.15 186 189 186H130L91 220V186H67C54.85 186 45 176.15 45 164V58Z"
    stroke="url(#uiGradient)"
    stroke-width="10"
    stroke-linejoin="round"
    opacity="0.28"
    filter="url(#softGlow)"
  />

  <!-- browser / design canvas -->
  <path
    d="M45 58C45 45.85 54.85 36 67 36H189C201.15 36 211 45.85 211 58V164C211 176.15 201.15 186 189 186H130L91 220V186H67C54.85 186 45 176.15 45 164V58Z"
    stroke="url(#uiGradient)"
    stroke-width="10"
    stroke-linejoin="round"
  />

  <!-- top bar -->
  <path d="M46 78H210" stroke="url(#uiGradient)" stroke-width="10" stroke-linecap="round"/>

  <!-- window dots -->
  <circle cx="68" cy="58" r="6" fill="#38BDF8"/>
  <circle cx="88" cy="58" r="6" fill="#4F7CFF"/>
  <circle cx="108" cy="58" r="6" fill="#6D5DFB"/>

